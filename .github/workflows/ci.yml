name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://rb.us

  deploy-infra:
    name: Deploy AWS infra
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lambda dependencies
        run: |
          npm install --prefix lambda/leads --omit=dev
          npm install --prefix lambda/banners --omit=dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        working-directory: amplify/backend
        run: sam build

      - name: SAM deploy
        working-directory: amplify/backend
        env:
          SES_NOTIFY_EMAIL: ${{ secrets.SES_NOTIFY_EMAIL }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
        run: |
          PARAMS="AllowedOrigin=https://rb.us"
          if [ -n "$SES_NOTIFY_EMAIL" ]; then
            PARAMS="$PARAMS NotifyEmail=${SES_NOTIFY_EMAIL}"
          fi
          if [ -n "$SES_FROM_EMAIL" ]; then
            PARAMS="$PARAMS FromEmail=${SES_FROM_EMAIL}"
          fi
          sam deploy \
            --stack-name wholesale-rakhi \
            --region "${AWS_REGION}" \
            --resolve-s3 \
            --capabilities "CAPABILITY_IAM" \
            --capabilities "CAPABILITY_AUTO_EXPAND" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides $PARAMS

      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --region "${AWS_REGION}" \
            --stack-name wholesale-rakhi \
            --query "Stacks[0].Outputs" \
            --output table
